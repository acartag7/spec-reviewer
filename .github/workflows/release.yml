name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v0.1.0"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve release tag
        id: release
        shell: bash
        env:
          RAW_TAG_NAME: ${{ github.event.inputs.tag || github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG_NAME="$RAW_TAG_NAME"
          [[ "$TAG_NAME" == v* ]] || TAG_NAME="v$TAG_NAME"
          if [[ ! "$TAG_NAME" =~ ^v[0-9]+(\.[0-9]+)*([.-][A-Za-z0-9]+)*$ ]]; then
            echo "::error::Invalid release tag: $TAG_NAME"
            exit 1
          fi
          git fetch --force --tags
          git rev-parse -q --verify "refs/tags/$TAG_NAME" >/dev/null || {
            echo "::error::Release tag does not exist: $TAG_NAME"
            exit 1
          }
          git checkout --detach "refs/tags/$TAG_NAME"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          if [[ "$PACKAGE_VERSION" != "${TAG_NAME#v}" ]]; then
            echo "::error::Release tag $TAG_NAME does not match package.json version $PACKAGE_VERSION"
            exit 1
          fi
          NOTES_FILE=""
          CANDIDATE_NOTES_FILE="docs/releases/$TAG_NAME.md"
          if [[ -s "$CANDIDATE_NOTES_FILE" ]]; then
            NOTES_FILE="$CANDIDATE_NOTES_FILE"
          elif ! gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "::error::Missing hand-written release notes: $CANDIDATE_NOTES_FILE"
            exit 1
          fi
          echo "tag=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "notes_file=$NOTES_FILE" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10.32.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.6
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - name: Build release artifacts
        run: pnpm run release:artifacts:all
      - name: Smoke native release artifact
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          mkdir -p build/native-smoke
          tar -xzf "artifacts/spec-reviewer-${RELEASE_TAG}-linux-x64.tar.gz" -C build/native-smoke --strip-components=1
          SPEC_REVIEWER_BINARY="$PWD/build/native-smoke/spec-reviewer" pnpm run binary:smoke
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_NOTES_FILE: ${{ steps.release.outputs.notes_file }}
        run: |
          TAG_NAME="$RELEASE_TAG"
          NOTES_FILE="$RELEASE_NOTES_FILE"
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" artifacts/*.tar.gz artifacts/SHA256SUMS artifacts/homebrew/spec-reviewer.rb --clobber
            if [[ -n "$NOTES_FILE" ]]; then
              gh release edit "$TAG_NAME" --title "$TAG_NAME" --notes-file "$NOTES_FILE"
            fi
          else
            [[ -n "$NOTES_FILE" ]] || {
              echo "::error::Cannot create a release without hand-written notes"
              exit 1
            }
            gh release create "$TAG_NAME" artifacts/*.tar.gz artifacts/SHA256SUMS artifacts/homebrew/spec-reviewer.rb --title "$TAG_NAME" --notes-file "$NOTES_FILE"
          fi
      - name: Update Homebrew tap
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [[ -z "$HOMEBREW_TAP_TOKEN" ]]; then
            echo "HOMEBREW_TAP_TOKEN is not configured; skipping tap update"
            exit 0
          fi
          GH_TOKEN="$HOMEBREW_TAP_TOKEN" pnpm run tap:update -- --skip-older --formula artifacts/homebrew/spec-reviewer.rb --tap acartag7/homebrew-tap
